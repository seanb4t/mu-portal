[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["spikes"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/seanb4t/mu-portal"
rust-version = "1.100"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
future_incompatible = { level = "warn", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = 10 }
redundant_clone = { level = "deny", priority = 9 }
manual_while_let_some = { level = "deny", priority = 4 }
pedantic = { level = "warn", priority = 3 }
allow_attributes = "deny"
allow_attributes_without_reason = "deny"

[workspace.dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "http2", "tokio"] }
axum-server = { version = "0.9.2", default-features = false, features = ["tls-rustls-no-provider"] }
backon = "1.6.0"
base64 = "0.23.1"
buffa = "0.9.2"
cargo_metadata = "0.23.1"
clap = { version = "4.6.7", features = ["derive", "env"] }
connectrpc = { version = "0.9.1", default-features = false, features = ["axum", "client"] }
connectrpc-build = "0.9.0"
fastrand = "2.5.0"
figment2 = { version = "0.11.5", default-features = false }
futures = "0.3.34"
governor = { version = "0.10.4", default-features = false, features = ["std"] }
hex = "0.4.3"
http = "1.5.0"
insta = "1.49.0"
miniz_oxide = "0.9.1"
opentelemetry = { version = "0.33.1", default-features = false, features = ["internal-logs", "metrics", "trace"] }
opentelemetry-otlp = { version = "0.33.1", default-features = false, features = ["grpc-tonic", "http-proto", "internal-logs", "metrics", "reqwest-blocking-client", "tls-ring", "trace"] }
opentelemetry-proto = { version = "0.33.1", default-features = false, features = ["gen-tonic", "metrics", "trace"] }
opentelemetry_sdk = { version = "0.33.1", default-features = false, features = ["internal-logs", "metrics", "trace"] }
portable-pty = "0.9.0"
proc-macro2 = "1.0.107"
proptest = "1.12.0"
prost = "0.14.6"
pulldown-cmark = { version = "0.13.6", default-features = false }
ratatui = { version = "0.30.2", default-features = false, features = ["layout-cache", "termina", "underline-color"] }
ratatui-textarea = { version = "0.9.4", default-features = false }
rcgen = "0.14.10"
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "rustls-no-provider"] }
rustix = { version = "1.1.6", features = ["fs", "process", "pty", "system"] }
rustls = { version = "0.23.46", default-features = false, features = ["ring", "std"] }
same-file = "1.0.6"
secrecy = "0.10.3"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = "2.1.1"
serde_json = "1.0.154"
serde_path_to_error = "0.1.20"
sha2 = "0.10.9"
syn = { version = "3.0.10", default-features = false }
tempfile = "3.27.0"
termina = { version = "0.3.3", features = ["event-stream"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
toml = "1.2.1"
tonic = { version = "0.14.9", default-features = false, features = ["tls-native-roots", "tls-ring"] }
tracing = "0.1.44"
tracing-opentelemetry = { version = "0.34.0", default-features = false, features = ["metrics"] }
tracing-subscriber = "0.3.23"
unicode-segmentation = "1.13.3"
unicode-width = "0.2.3"
url = "2.5.9"
uuid = { version = "1.29.2", features = ["v4"] }
vt100 = "0.18.1"
vte = "0.15.0"
walkdir = "2.5.0"

# The fork of ratatui-textarea, at its branch `mu`: a cursor that moves by grapheme, a width
# function, and the count of the wrapped rows. The patch applies only while the fork has the
# version that `[workspace.dependencies]` asks for.
[patch.crates-io]
ratatui-textarea = { git = "https://github.com/seanb4t/ratatui-textarea", rev = "462cce4cdf10ba145f18cc27abadbea240379598" }
