[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["spikes"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/seanb4t/mu-portal"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

[workspace.dependencies]
cargo_metadata = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
proptest = "1.12.0"
tempfile = "3.27.0"
toml = "1.2.1"
