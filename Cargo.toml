[workspace]
resolver = "3"
members = ["crates/*"]
exclude = ["spikes"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/seanb4t/mu-portal"
rust-version = "1.100"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"
future_incompatible = { level = "warn", priority = -1 }
nonstandard_style = { level = "deny", priority = -1 }
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "deny", priority = 10 }
redundant_clone = { level = "deny", priority = 9 }
manual_while_let_some = { level = "deny", priority = 4 }
pedantic = { level = "warn", priority = 3 }
allow_attributes = "deny"
allow_attributes_without_reason = "deny"

[workspace.dependencies]
cargo_metadata = "0.23.1"
clap = { version = "4.6.7", features = ["derive"] }
proc-macro2 = "1.0.107"
proptest = "1.12.0"
pulldown-cmark = { version = "0.13.6", default-features = false }
serde-saphyr = "2.1.1"
serde_json = "1.0.154"
syn = { version = "3.0.10", default-features = false }
tempfile = "3.27.0"
toml = "1.2.1"
