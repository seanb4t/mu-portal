[package]
name = "mu-cli"
description = "The mu binary and its verbs"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
clap = { workspace = true }
http = { workspace = true }
mu-client = { path = "../mu-client" }
mu-config = { path = "../mu-config" }
mu-core = { path = "../mu-core" }
mu-fake-server = { path = "../mu-fake-server" }
mu-server = { path = "../mu-server" }
mu-tui = { path = "../mu-tui" }
opentelemetry = { workspace = true }
opentelemetry-otlp = { workspace = true }
opentelemetry_sdk = { workspace = true }
reqwest = { workspace = true }
rustix = { workspace = true }
rustls = { workspace = true }
serde = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
toml = { workspace = true }
tonic = { workspace = true }
tracing = { workspace = true }
tracing-opentelemetry = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
axum = { workspace = true }
axum-server = { workspace = true }
cargo_metadata = { workspace = true }
connectrpc = { workspace = true }
futures = { workspace = true }
hex = { workspace = true }
mu-proto = { path = "../mu-proto" }
opentelemetry-proto = { workspace = true }
opentelemetry_sdk = { workspace = true, features = ["testing"] }
portable-pty = { workspace = true }
proc-macro2 = { workspace = true, features = ["span-locations"] }
proptest = { workspace = true }
prost = { workspace = true }
pulldown-cmark = { workspace = true }
rcgen = { workspace = true }
serde-saphyr = { workspace = true }
serde_json = { workspace = true }
syn = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true, features = ["test-util"] }
tonic = { workspace = true, features = ["router", "server"] }
vt100 = { workspace = true }

[[bin]]
name = "mu"
path = "src/main.rs"
