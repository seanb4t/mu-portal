syntax = "proto3";

package mu.v1;

// The API of the mu server: commands to worlds and one event stream for
// all worlds.
service PortalService {
  // Streams a Hello, the recorded events from `from_seq`, then each new event.
  rpc Subscribe(SubscribeRequest) returns (stream SubscribeResponse);

  // Returns each world with its state.
  rpc ListWorlds(ListWorldsRequest) returns (ListWorldsResponse);

  // Sends one line to one world.
  rpc Send(SendRequest) returns (SendResponse);

  // Connects one world.
  rpc Connect(ConnectRequest) returns (ConnectResponse);

  // Disconnects one world.
  rpc Disconnect(DisconnectRequest) returns (DisconnectResponse);

  // Returns the configuration of one client: its layers merged from the defaults to the device.
  rpc GetClientConfig(GetClientConfigRequest) returns (GetClientConfigResponse);

  // Streams the current store hash, then each new store hash after a reload that changes it.
  rpc WatchConfig(WatchConfigRequest) returns (stream WatchConfigResponse);

  // Reads the configuration directory again and applies the new client layers.
  rpc ReloadConfig(ReloadConfigRequest) returns (ReloadConfigResponse);

  // Returns each built-in layout and each good layout file, and the notice of each bad one.
  rpc ListLayouts(ListLayoutsRequest) returns (ListLayoutsResponse);

  // Returns each block of one layout with its rectangle on a screen of one size.
  rpc DescribeLayout(DescribeLayoutRequest) returns (DescribeLayoutResponse);

  // Writes a layout file. With a device, the layer of that device then names the layout.
  rpc SaveLayout(SaveLayoutRequest) returns (SaveLayoutResponse);

  // Applies one change to a layout, and saves the result.
  rpc EditLayout(EditLayoutRequest) returns (EditLayoutResponse);

  // Sets the layout of a device, or of one world or one game for that device.
  rpc UseLayout(UseLayoutRequest) returns (UseLayoutResponse);
}

// `from_seq` is the first sequence number that the client wants. 0 and 1
// both mean the start of the journal.
message SubscribeRequest {
  uint64 from_seq = 1;
}

message SubscribeResponse {
  oneof message {
    Hello hello = 1;
    Event event = 2;
  }
}

// The first message of each stream.
message Hello {
  // A random id of each start of the server.
  string instance_id = 1;
  // The last sequence number in the journal when the stream starts, or 0 for no event.
  uint64 last_seq = 2;
}

message Event {
  uint64 seq = 1;
  string world = 2;
  EventKind kind = 3;
  Source source = 4;
  string text = 5;
  // Milliseconds since the Unix epoch.
  int64 time_ms = 6;
}

enum EventKind {
  EVENT_KIND_UNSPECIFIED = 0;
  EVENT_KIND_CONNECTED = 1;
  EVENT_KIND_DISCONNECTED = 2;
  EVENT_KIND_LINE = 3;
  EVENT_KIND_PROMPT = 4;
  EVENT_KIND_MESSAGE = 5;
  EVENT_KIND_INPUT = 6;
  EVENT_KIND_ECHO = 7;
  EVENT_KIND_LOGIN = 8;
  EVENT_KIND_CUSTOM = 9;
  EVENT_KIND_SCRIPT_ERROR = 10;
}

enum Source {
  SOURCE_UNSPECIFIED = 0;
  SOURCE_GAME = 1;
  SOURCE_PLAYER = 2;
  SOURCE_SCRIPT = 3;
  SOURCE_SYSTEM = 4;
  SOURCE_CREDENTIAL = 5;
}

enum WorldState {
  WORLD_STATE_UNSPECIFIED = 0;
  WORLD_STATE_CONNECTING = 1;
  WORLD_STATE_CONNECTED = 2;
  WORLD_STATE_DISCONNECTED = 3;
  WORLD_STATE_RECONNECTING = 4;
}

message ListWorldsRequest {}

message ListWorldsResponse {
  repeated World worlds = 1;
  // The configuration directory that the server read its worlds from, as an absolute path with
  // each symbolic link resolved. A server with no directory sets no value.
  optional string config_dir = 2;
}

message World {
  string id = 1;
  WorldState state = 2;
  // In the state WORLD_STATE_RECONNECTING, the time of the next attempt, in milliseconds since
  // the Unix epoch.
  optional int64 next_attempt_ms = 3;
  // The text that the game reads as a line break inside one command. A world with none takes
  // only a text of one line.
  optional string line_break = 4;
}

message SendRequest {
  string world = 1;
  string text = 2;
}

// No `seq` means that a hook gagged the line.
message SendResponse {
  optional uint64 seq = 1;
}

message ConnectRequest {
  string world = 1;
}

message ConnectResponse {}

message DisconnectRequest {
  string world = 1;
}

message DisconnectResponse {}

// One client: its kind, such as `tui`, its OS, `macos` or `linux`, and its device name.
message GetClientConfigRequest {
  string kind = 1;
  string os = 2;
  string device = 3;
}

message GetClientConfigResponse {
  // The hash of every file under `clients/` that the reply comes from.
  string store_hash = 1;
  // The hash of the layers of this client.
  string revision = 2;
  // How the client shows the echo line of a send: `show`, `dim` or `hide`.
  string echo = 3;
  // Each key, by its canonical name, and the entry that it runs, or `none`.
  repeated Binding bindings = 4;
  // The path of each field, such as `echo` or `keys.alt+n`, and the path of the layer that set
  // it, relative to the configuration directory, or `default`.
  map<string, string> sources = 5;
  // One notice for each bad layer that applies to the client, and for each bad entry at the
  // path of a layer directory.
  repeated Notice notices = 6;
  // The name of the layout of the screen: a built-in layout or a layout file.
  string layout_name = 7;
  // The lines of that layout, in order.
  repeated string layout = 8;
  // The label of a world tab.
  string tab_label = 9;
  // The names of the segments of the statusline from the left edge.
  repeated string statusline_left = 10;
  // The names of the segments of the statusline to the right edge.
  repeated string statusline_right = 11;
  // The layout of a world or of a game, for each entry of `[world-layouts]` with a good layout.
  repeated NamedLayout world_layouts = 12;
}

// One layout with its lines.
message NamedLayout {
  // The key of a `[world-layouts]` entry: a world id or the name of a game. Empty in a list of
  // layouts.
  string key = 1;
  // The name of the layout.
  string name = 2;
  // The lines of the layout, in order.
  repeated string lines = 3;
  // Whether mu ships the layout.
  bool built_in = 4;
}

message Binding {
  string key = 1;
  string entry = 2;
}

// A bad file or place: its path, relative to the configuration directory when it is under
// it, and the whole text of the notice. Neither holds a control character.
message Notice {
  string path = 1;
  string text = 2;
}

message WatchConfigRequest {}

message WatchConfigResponse {
  string store_hash = 1;
}

message ListLayoutsRequest {}

message ListLayoutsResponse {
  // Each built-in layout and each good layout file, in the order of the names.
  repeated NamedLayout layouts = 1;
  // One notice for each bad layout file.
  repeated Notice notices = 2;
}

message DescribeLayoutRequest {
  // The name of a built-in layout or of a layout file.
  string name = 1;
  // The columns and the rows of the screen.
  uint32 width = 2;
  uint32 height = 3;
}

message DescribeLayoutResponse {
  // Each block of the layout, in the order of its lines.
  repeated DescribedBlock blocks = 1;
}

// One block of a layout on a screen of one size.
message DescribedBlock {
  // The id of the block.
  string id = 1;
  // The name of the block in a sentence, such as `output`.
  string name = 2;
  // The number of its line, from 1.
  uint32 line = 3;
  // The rectangle of its pane: the first column and the first row, from 0, and the counts of
  // the columns and of the rows.
  uint32 x = 4;
  uint32 y = 5;
  uint32 width = 6;
  uint32 height = 7;
  // Whether the block is the first of its pane, which shows when a client starts.
  bool front = 8;
  // What the block shows, as text.
  string data_source = 9;
}

message SaveLayoutRequest {
  // The name of the layout file.
  string name = 1;
  // The lines of the plan, in order.
  repeated string lines = 2;
  // The device whose layer then names the layout. Empty for no device.
  string device = 3;
}

message SaveLayoutResponse {}

message UseLayoutRequest {
  string device = 1;
  // The name of the layout. Empty with a key removes the entry of that key.
  string name = 2;
  // A world id or the name of a game, for an entry of `[world-layouts]`. Empty for the field
  // `layout`.
  string key = 3;
}

message UseLayoutResponse {}

message EditLayoutRequest {
  // The name of the layout to change.
  string name = 1;
  // The device, which a change of a built-in layout needs. Empty for no device.
  string device = 2;
  // A world id. A change of a built-in layout then sets the choice that gives the layout of
  // that world. Empty for the field `layout`.
  string world = 3;
  oneof change {
    // Put the block of this sentence on the screen.
    string place = 4;
    // Take the block with this id off the screen.
    string hide = 5;
    // Set the size of a block.
    SizeChange size = 6;
    // Put a line into the plan.
    InsertLine insert = 7;
    // Replace a line of the plan.
    ReplaceLine replace = 8;
    // Remove the line with this number or this id.
    string delete = 9;
  }
}

message SizeChange {
  // The id of the block.
  string id = 1;
  // The size, such as `30%`, `12` or `max 3`.
  string size = 2;
}

message InsertLine {
  // The number of the new line, from 1.
  uint32 number = 1;
  // The sentence.
  string line = 2;
}

message ReplaceLine {
  // The number or the id of the line.
  string line = 1;
  // The new sentence.
  string sentence = 2;
}

message EditLayoutResponse {
  // The name of the layout that the edit wrote.
  string name = 1;
  // The lines of that layout, in order.
  repeated string lines = 2;
  // Whether mu wrote the whole plan again, because no edit of one line gave the screen.
  bool rewritten = 3;
}

message ReloadConfigRequest {}

message ReloadConfigResponse {
  // One notice for each bad file.
  repeated Notice notices = 1;
  // The path of each world file and of `server.toml` that differs from the snapshot of the
  // start of the server. The change applies at the next start.
  repeated string restart = 2;
}
