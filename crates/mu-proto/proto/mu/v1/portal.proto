syntax = "proto3";

package mu.v1;

// The API of the mu server: commands to worlds and one event stream for
// all worlds.
service PortalService {
  // Streams a Hello, the recorded events from `from_seq`, then each new event.
  rpc Subscribe(SubscribeRequest) returns (stream SubscribeResponse);

  // Returns each world with its state.
  rpc ListWorlds(ListWorldsRequest) returns (ListWorldsResponse);

  // Sends one line to one world.
  rpc Send(SendRequest) returns (SendResponse);

  // Connects one world.
  rpc Connect(ConnectRequest) returns (ConnectResponse);

  // Disconnects one world.
  rpc Disconnect(DisconnectRequest) returns (DisconnectResponse);

  // Returns the configuration of one client: its layers merged from the defaults to the device.
  rpc GetClientConfig(GetClientConfigRequest) returns (GetClientConfigResponse);

  // Streams the current store hash, then each new store hash after a reload that changes it.
  rpc WatchConfig(WatchConfigRequest) returns (stream WatchConfigResponse);

  // Reads the configuration directory again and applies the new client layers.
  rpc ReloadConfig(ReloadConfigRequest) returns (ReloadConfigResponse);
}

// `from_seq` is the first sequence number that the client wants. 0 and 1
// both mean the start of the journal.
message SubscribeRequest {
  uint64 from_seq = 1;
}

message SubscribeResponse {
  oneof message {
    Hello hello = 1;
    Event event = 2;
  }
}

// The first message of each stream.
message Hello {
  // A random id of each start of the server.
  string instance_id = 1;
  // The last sequence number in the journal when the stream starts, or 0 for no event.
  uint64 last_seq = 2;
}

message Event {
  uint64 seq = 1;
  string world = 2;
  EventKind kind = 3;
  Source source = 4;
  string text = 5;
  // Milliseconds since the Unix epoch.
  int64 time_ms = 6;
}

enum EventKind {
  EVENT_KIND_UNSPECIFIED = 0;
  EVENT_KIND_CONNECTED = 1;
  EVENT_KIND_DISCONNECTED = 2;
  EVENT_KIND_LINE = 3;
  EVENT_KIND_PROMPT = 4;
  EVENT_KIND_MESSAGE = 5;
  EVENT_KIND_INPUT = 6;
  EVENT_KIND_ECHO = 7;
  EVENT_KIND_LOGIN = 8;
  EVENT_KIND_CUSTOM = 9;
  EVENT_KIND_SCRIPT_ERROR = 10;
}

enum Source {
  SOURCE_UNSPECIFIED = 0;
  SOURCE_GAME = 1;
  SOURCE_PLAYER = 2;
  SOURCE_SCRIPT = 3;
  SOURCE_SYSTEM = 4;
  SOURCE_CREDENTIAL = 5;
}

enum WorldState {
  WORLD_STATE_UNSPECIFIED = 0;
  WORLD_STATE_CONNECTING = 1;
  WORLD_STATE_CONNECTED = 2;
  WORLD_STATE_DISCONNECTED = 3;
  WORLD_STATE_RECONNECTING = 4;
}

message ListWorldsRequest {}

message ListWorldsResponse {
  repeated World worlds = 1;
  // The configuration directory that the server read its worlds from, as an absolute path with
  // each symbolic link resolved. A server with no directory sets no value.
  optional string config_dir = 2;
}

message World {
  string id = 1;
  WorldState state = 2;
  // In the state WORLD_STATE_RECONNECTING, the time of the next attempt, in milliseconds since
  // the Unix epoch.
  optional int64 next_attempt_ms = 3;
  // The text that the game reads as a line break inside one command. A world with none takes
  // only a text of one line.
  optional string line_break = 4;
}

message SendRequest {
  string world = 1;
  string text = 2;
}

// No `seq` means that a hook gagged the line.
message SendResponse {
  optional uint64 seq = 1;
}

message ConnectRequest {
  string world = 1;
}

message ConnectResponse {}

message DisconnectRequest {
  string world = 1;
}

message DisconnectResponse {}

// One client: its kind, such as `tui`, its OS, `macos` or `linux`, and its device name.
message GetClientConfigRequest {
  string kind = 1;
  string os = 2;
  string device = 3;
}

message GetClientConfigResponse {
  // The hash of every file under `clients/` that the reply comes from.
  string store_hash = 1;
  // The hash of the layers of this client.
  string revision = 2;
  // How the client shows the echo line of a send: `show`, `dim` or `hide`.
  string echo = 3;
  // Each key, by its canonical name, and the entry that it runs, or `none`.
  repeated Binding bindings = 4;
  // The path of each field, such as `echo` or `keys.alt+n`, and the path of the layer that set
  // it, relative to the configuration directory, or `default`.
  map<string, string> sources = 5;
  // One notice for each bad layer that applies to the client, and for each bad entry at the
  // path of a layer directory.
  repeated Notice notices = 6;
}

message Binding {
  string key = 1;
  string entry = 2;
}

// A bad file or place: its path, relative to the configuration directory when it is under
// it, and the whole text of the notice. Neither holds a control character.
message Notice {
  string path = 1;
  string text = 2;
}

message WatchConfigRequest {}

message WatchConfigResponse {
  string store_hash = 1;
}

message ReloadConfigRequest {}

message ReloadConfigResponse {
  // One notice for each bad file.
  repeated Notice notices = 1;
  // The path of each world file and of `server.toml` that differs from the snapshot of the
  // start of the server. The change applies at the next start.
  repeated string restart = 2;
}
