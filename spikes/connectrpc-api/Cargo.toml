[package]
name = "connectrpc-api"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "http2", "tokio"] }
buffa = { version = "0.9.2", features = ["json"] }
connectrpc = { version = "0.9.1", features = ["axum", "client"] }
futures = "0.3.34"
http = "1.5.0"
http-body = "1.1.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["macros", "net", "rt-multi-thread", "sync", "io-util"] }
tokio-stream = { version = "0.1.19", features = ["sync"] }

[dev-dependencies]
tempfile = "3.27.0"

[build-dependencies]
connectrpc-build = "0.9.0"
