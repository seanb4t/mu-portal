[package]
name = "embedded-tailscale"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
axum = { version = "0.8.9", default-features = false, features = ["http1", "http2", "tokio"] }
connectrpc-api = { path = "../connectrpc-api" }
tailscale = { version = "0.7.1", features = ["axum"] }
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal"] }
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }

[dev-dependencies]
tempfile = "=3.27.0"
