[package]
name = "terminal-backend"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
publish = false

[dependencies]
crossterm = { version = "0.29.0", features = ["event-stream"] }
futures = "0.3.34"
termina = { version = "0.3.3", features = ["event-stream"] }
tokio = { version = "1.54.1", features = ["macros", "rt", "sync", "time"] }
